<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOTS Ladder</title>
  <meta name="description" content="Tracking my powerlifting DOTS score against anonymous UK meet benchmarks.">
  <meta name="theme-color" content="#c2410c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="app/style.css">
  <script type="module" src="app/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</head>
<body>
  <main>
    <header>
      <h1>DOTS Ladder</h1>
      <p id="subtitle" class="muted">Loading…</p>
    </header>

    <section class="card hero" aria-labelledby="now-heading">
      <h2 id="now-heading" class="label">Current DOTS</h2>
      <p id="now-dots" class="big">–</p>
      <p id="now-detail" class="muted"></p>
      <p id="now-warning" class="warning small" role="alert" hidden></p>
    </section>

    <details class="card edit">
      <summary class="label">Edit your numbers</summary>
      <button id="reset" class="icon-button" type="button" aria-label="Reset to defaults" title="Reset to defaults">↺</button>
      <form id="profile-form" class="fields" autocomplete="off">
        <label>Sex
          <select name="sex">
            <option value="M">Men</option>
            <option value="F">Women</option>
          </select>
        </label>
        <label>Bodyweight (kg)
          <input name="bodyweight" type="number" inputmode="decimal" step="any" min="30" max="250" required>
        </label>
        <label>Squat 1RM (kg)
          <input name="squat" type="number" inputmode="decimal" step="any" min="1" max="600" required>
        </label>
        <label>Bench 1RM (kg)
          <input name="bench" type="number" inputmode="decimal" step="any" min="1" max="600" required>
        </label>
        <label>Deadlift 1RM (kg)
          <input name="deadlift" type="number" inputmode="decimal" step="any" min="1" max="600" required>
        </label>
        <label>Weight class
          <select name="weightClass"></select>
        </label>
        <p id="class-note" class="muted small wide"></p>
        <p id="save-note" class="muted small wide" role="status"></p>
      </form>
    </details>

    <section class="card next" aria-labelledby="next-heading">
      <h2 id="next-heading" class="label">Next rung</h2>
      <p id="next-rung"></p>
    </section>

    <section class="card" aria-labelledby="ladder-heading">
      <h2 id="ladder-heading" class="label">The ladder</h2>
      <div id="experience" class="tabs" role="group" aria-label="Compare against"></div>
      <p id="group-note" class="muted small"></p>
      <ol id="ladder" class="ladder"></ol>
    </section>

    <p id="error" class="error" hidden></p>
  </main>

  <footer class="muted small">
    <p>Rungs are anonymous DOTS percentiles of UK raw full-power results, from groups of 20+ lifters. No individual lifters are shown.</p>
    <p>Data: <a href="https://www.openpowerlifting.org/">OpenPowerlifting</a> (public domain)<span id="snapshot"></span>.</p>
  </footer>
</body>
</html>
